# Configuración de Base de Datos - Sistema de Gestión de Urgencias
# -----------------------------------------------
# Perfil Docker (recomendado): usa el contenedor definido en docker-compose.yml.
# El contenedor expone MariaDB en el puerto 3307 del host.
db.url=jdbc:mariadb://localhost:3307/Emergencia_Medica
db.user=usuario_sistema
db.password=1234
db.driver=org.mariadb.jdbc.Driver

# -----------------------------------------------
# Perfil Local (sin Docker): si prefieres ejecutar
# MariaDB directamente en tu máquina, cambia la URL
# al puerto 3306 y asegúrate de haber creado el
# usuario 'usuario_sistema' con password '1234'.
# db.url=jdbc:mariadb://localhost:3306/Emergencia_Medica